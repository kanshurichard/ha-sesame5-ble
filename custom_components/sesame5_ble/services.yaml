add_passcode:
  name: Add Passcode
  description: Add a passcode to a Sesame Touch / Keypad device, supporting temporary passcodes with an expiry duration and one-time passcodes that auto-delete after first unlock.
  fields:
    device_id:
      name: Device
      description: Target keypad device (optional).
      required: false
      selector:
        device:
          integration: sesame5_ble
    address:
      name: Bluetooth MAC Address
      description: Bluetooth MAC address of the keypad (optional).
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    passcode:
      name: Passcode
      description: 4 to 16 digit numerical passcode.
      required: true
      example: "123456"
      selector:
        text:
          type: text
    name:
      name: Passcode Name
      description: Name or label for the passcode (e.g. Guest, Cleaner, Delivery).
      required: false
      default: "HA Temp"
      example: "Cleaner"
      selector:
        text:
    duration:
      name: Duration (Seconds)
      description: Validity duration in seconds. The system will automatically remove this passcode from the keypad after the time expires. Leave empty for permanent.
      required: false
      example: 3600
      selector:
        number:
          min: 10
          max: 2592000
          unit_of_measurement: seconds
          mode: box
    one_time:
      name: Auto-delete After One Use
      description: When enabled, this passcode will be automatically deleted from the keypad after it is successfully used once to unlock the door.
      required: false
      default: false
      selector:
        boolean:

delete_passcode:
  name: Delete Passcode
  description: Delete a specific passcode from a Sesame Touch / Keypad device.
  fields:
    device_id:
      name: Device
      description: Target keypad device (optional).
      required: false
      selector:
        device:
          integration: sesame5_ble
    address:
      name: Bluetooth MAC Address
      description: Bluetooth MAC address of the keypad (optional).
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    passcode:
      name: Passcode or Passcode ID
      description: Passcode digits (e.g. 123456) or hex ID to delete.
      required: true
      example: "123456"
      selector:
        text:

get_passcodes:
  name: Get Passcode List
  description: Retrieve all registered passcodes from a Sesame Touch / Keypad device.
  fields:
    device_id:
      name: Device
      description: Target keypad device (optional).
      required: false
      selector:
        device:
          integration: sesame5_ble
    address:
      name: Bluetooth MAC Address
      description: Bluetooth MAC address of the keypad (optional).
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
