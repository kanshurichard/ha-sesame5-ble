add_passcode:
  name: 添加密码
  description: 向 Sesame Touch / 密码键盘添加密码，支持设置有效时长的临时密码以及开锁一次后自动删除的单次密码。
  fields:
    device_id:
      name: 设备
      description: 目标密码键盘设备（可选）。
      required: false
      selector:
        device:
          integration: sesame5_ble
    address:
      name: 蓝牙 MAC 地址
      description: 键盘设备的蓝牙 MAC 地址（可选）。
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    passcode:
      name: 密码
      description: 4 到 16 位数字密码。
      required: true
      example: "123456"
      selector:
        text:
          type: text
    name:
      name: 密码备注名称
      description: 密码的备注名称（如访客、保洁、快递等）。
      required: false
      default: "HA Temp"
      example: "保洁阿姨"
      selector:
        text:
    duration:
      name: 有效时长（秒）
      description: 临时密码有效时间（单位：秒）。超时后系统将自动从密码键盘中删除此密码。如需永久有效请留空。
      required: false
      example: 3600
      selector:
        number:
          min: 10
          max: 2592000
          unit_of_measurement: seconds
          mode: box
    one_time:
      name: 单次开锁后自动删除
      description: 开启后，当该密码被成功使用开锁一次后，系统将自动从密码键盘中删除此密码。
      required: false
      default: false
      selector:
        boolean:

delete_passcode:
  name: 删除密码
  description: 从 Sesame Touch / 密码键盘中删除指定密码。
  fields:
    device_id:
      name: 设备
      description: 目标密码键盘设备（可选）。
      required: false
      selector:
        device:
          integration: sesame5_ble
    address:
      name: 蓝牙 MAC 地址
      description: 键盘设备的蓝牙 MAC 地址（可选）。
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    passcode:
      name: 密码或密码ID
      description: 要删除的密码数字（如 123456）或 16 进制 ID。
      required: true
      example: "123456"
      selector:
        text:

