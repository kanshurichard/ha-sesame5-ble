add_passcode:
  name: Add Passcode
  description: "Add a passcode to a Sesame Touch / Keypad device (Touch 1/2 series). Supports temporary passcodes with an expiry duration and one-time passcodes. WARNING: Both temporary expiry and one-time deletion are managed by Home Assistant via BLE. If the keypad is unreachable when the timer expires or when the door unlocks, deletion will fail. Also note that one-time passcodes auto-delete upon ANY keypad password unlock on the linked lock, because the lock protocol does not distinguish which passcode was entered."
  fields:
    device_id:
      name: Device
      description: Target keypad device (optional).
      required: false
      selector:
        device:
          integration: sesame5_ble
    address:
      name: Bluetooth MAC Address
      description: Bluetooth MAC address of the keypad (optional).
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    passcode:
      name: Passcode
      description: 4 to 16 digit numerical passcode.
      required: true
      example: "123456"
      selector:
        text:
          type: password
    name:
      name: Passcode Name
      description: Name or label for the passcode (e.g. Guest, Cleaner, Delivery).
      required: false
      default: "HA Temp"
      example: "Cleaner"
      selector:
        text:
    duration:
      name: Duration (Seconds)
      description: "Validity duration in seconds. Home Assistant automatically deletes this passcode when the timer expires. WARNING: The keypad must be reachable via Bluetooth at expiration time to complete deletion; otherwise, the passcode will remain until manually deleted. Leave empty for permanent."
      required: false
      example: 3600
      selector:
        number:
          min: 10
          max: 2592000
          unit_of_measurement: seconds
          mode: box
    one_time:
      name: Auto-delete After One Use
      description: "Automatically delete passcode after unlock. WARNING: Requires active Bluetooth connection between HA and keypad to complete deletion. Also note that ANY keypad password unlock on the linked lock triggers this deletion, because the lock hardware protocol does not distinguish which passcode PIN was entered."
      required: false
      default: false
      selector:
        boolean:

delete_passcode:
  name: Delete Passcode
  description: Delete a specific passcode from a Sesame Touch / Keypad device.
  fields:
    device_id:
      name: Device
      description: Target keypad device (optional).
      required: false
      selector:
        device:
          integration: sesame5_ble
    address:
      name: Bluetooth MAC Address
      description: Bluetooth MAC address of the keypad (optional).
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    passcode:
      name: Passcode or Passcode ID
      description: Passcode digits (e.g. 123456) or hex ID to delete.
      required: true
      example: "123456"
      selector:
        text:
          type: password

get_passcodes:
  name: Get Passcode List
  description: Retrieve all registered passcodes from a Sesame Touch / Keypad device.
  fields:
    device_id:
      name: Device
      description: Target keypad device (optional).
      required: false
      selector:
        device:
          integration: sesame5_ble
    address:
      name: Bluetooth MAC Address
      description: Bluetooth MAC address of the keypad (optional).
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
